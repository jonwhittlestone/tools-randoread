<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>randoread</title>
  <!-- Traefik strips the /randoread path prefix before proxying here, but the
       browser's URL bar (and therefore relative-URL resolution) still has it.
       <base> makes every relative link/fetch resolve under /randoread/
       regardless of whether the visited URL had a trailing slash. -->
  <base href="/randoread/" />
  <link rel="stylesheet" href="style.css" />
  <!-- Installable app (main-randoread.md 05.03): the manifest makes Chrome
       offer "Install app" and launch standalone, without the browser bar.
       Resolves via <base> to /randoread/manifest.webmanifest. -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0d1117" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23ff3cd5'/%3E%3Ctext x='50' y='74' font-size='62' font-family='Arial, Helvetica, sans-serif' font-weight='bold' text-anchor='middle' fill='white'%3ER%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <section id="login-screen" class="hidden">
    <h1>randoread</h1>
    <p>Use your login link to access randoread. Visit
      <code>/randoread/?token=&lt;token&gt;</code> to log in — the token is
      then remembered on this device for 90 days.</p>
  </section>

  <section id="app" class="hidden">
    <header class="app-header">
      <div class="toolbar">
        <!-- Mobile only (see the @media block in style.css) — collapses the
             toolbar to just the active section + this toggle, expanding to
             the full pill-button list (styling/emojis intact) as a dropdown
             on tap. Hidden entirely on desktop, where all 5 always show. -->
        <button id="toolbar-toggle" class="pill-button toolbar-toggle" type="button" aria-label="Choose section" aria-expanded="false">▾</button>
        <button id="daily-button" class="pill-button">Daily 📅</button>
        <button id="rando-button" class="pill-button">Rando ♻</button>
        <button id="rando-clipped-button" class="pill-button">Rando Clipped 🎠</button>
        <button id="clipped-button" class="pill-button">Most Recently Clipped ✂️</button>
        <button id="watching-button" class="pill-button">Watching it Later 👀</button>
        <div class="spacer"></div>
        <button id="menu-button" class="icon-button" aria-label="Menu">☰</button>
      </div>
      <hr />

      <div id="menu-panel" class="menu-panel hidden">
        <div id="dropbox-status">Dropbox: checking…</div>
        <button id="dropbox-connect-btn" class="hidden">Connect Dropbox</button>
        <button id="dropbox-disconnect-btn" class="hidden">Disconnect Dropbox</button>
        <button id="email-button">Email this note</button>
        <div id="email-status"></div>
      </div>

      <div class="note-title-row">
        <!-- main-randoread.md 05.06: the ℹ️ explains the Daily title's
             collapse/expand-all tap (05.04). Shown in Daily only. -->
        <div class="note-title-left">
          <div id="note-title"></div>
          <button id="note-title-info" type="button" hidden
                  aria-label="What does tapping the title do?"
                  aria-expanded="false" aria-controls="note-title-tip">ℹ️</button>
          <span id="note-title-tip" role="tooltip" hidden>Tap the date to collapse or expand all sections.</span>
        </div>
        <span id="note-title-right"></span>
      </div>
    </header>

    <div id="note-scroll">
      <div id="note-content"></div>
    </div>
  </section>

  <!-- Single global vim cursor overlay — only one note editor (Watching It
       Later's Notes panel) is ever shown at a time, so one shared element is
       enough. See vim-mode.js / watching-notes.js. -->
  <div id="vimCursor" class="vim-cursor" style="display: none"></div>

  <script src="emoji-picker.js"></script>
  <script src="vim-mode.js"></script>
  <script src="foldable-headings.js"></script>
  <script src="watching-notes.js"></script>
  <script src="journal.js"></script>
  <script src="app.js"></script>
</body>
</html>
